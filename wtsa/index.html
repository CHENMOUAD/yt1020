    <style>
        :root {
            --bg-color: #fff0f6;
            --card-bg: #ffffff;

            --text-main: #3d0a2e;
            --text-sub: #a1637f;
            --gradient-btn: linear-gradient(90deg, #ff6fb5 0%, #ff2d7b 100%);

        * {

            padding: 0;

        }

        body {

        /* 模拟手机屏幕的容器 */

        }

        /* 顶部导航 */

            justify-content: space-between;
            align-items: center;

            align-items: center;

        }

        .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 2px 10px rgba(255, 45, 123, 0.25);
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-purple);
        }

        .logo-text p {

        }

        /* 主视觉区域 */

            padding: 40px 20px 20px;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .hero h2 {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 5px;
            text-align: center;
        }

        .hero h2 .highlight {
            background: var(--gradient-btn);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
        }

        .cta-main {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-btn);
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 6px 18px rgba(255, 45, 123, 0.4);
            transition: transform 0.2s;
        }

        .cta-main:active {
            transform: scale(0.95);
        }

        .hero-tagline {
            position: absolute;
            right: 10px;
            bottom: 40px;
            font-size: 12px;
            font-style: italic;
            color: #ff2d7b;
            text-align: right;
            transform: rotate(-10deg);
            line-height: 1.3;
        }

        /* 在线人数统计 */
        .stats-bar {
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
            margin-bottom: 20px;
        }

        .avatars {
            display: flex;
        }

        .avatars img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            margin-left: -8px;
        }
        .avatars img:first-child { margin-left: 0; }

        .stats-text {
            font-size: 12px;
            color: #4cd964;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stats-text::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #4cd964;
            border-radius: 50%;
            box-shadow: 0 0 5px #4cd964;
        }

        /* 功能图标栏 */
        .features-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 20px;
            margin-bottom: 25px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 45, 123, 0.1);
            border: 1px solid rgba(255, 45, 123, 0.28);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-pink);
            font-size: 16px;
        }

        .feature-item span {
            font-size: 10px;
            color: var(--text-sub);
            line-height: 1.2;
        }

            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 15px;
        }

        .section-header h3 {

            display: flex;
            align-items: center;
            gap: 8px;
        }

            height: 10px;
            background: #4cd964;
            border-radius: 50%;
            box-shadow: 0 0 8px #4cd964;
        }

        .view-all {

            color: var(--text-sub);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* 照片墙：垂直错落滚动 */
        .rooms-wall {
            position: relative;
            height: 900px;
            overflow: hidden;
            margin: 0 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
        }
        .rooms-wall__col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }
        .rooms-wall__col .room-card {
            flex-shrink: 0;
            margin-bottom: 12px;
        }
        .rooms-wall__col--up {
            animation: wall-scroll-up 40s linear infinite;
        }
        @keyframes wall-scroll-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .room-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;

        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .card-overlay {

            top: 0;
            left: 0;
            width: 100%;

            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, rgba(61,10,46,0.92) 100%);

        .card-info {

        .card-meta {

            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-meta .location {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-meta .status {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #4cd964;
        }

        .card-btn {

            border: none;
            background: var(--gradient-btn);
            color: white;
            font-size: 10px;

            justify-content: center;
            align-items: center;

        }

        .bottom-cta {
            margin: 20px;

        .bottom-cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 45, 123, 0.4);
            transition: transform 0.2s;
        }
        .bottom-cta-btn:active {
            transform: scale(0.95);
        }

        /* 底部悬浮按钮 */
        .floating-cta {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 390px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--gradient-btn);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 6px 20px rgba(255, 45, 123, 0.5);
            transition: transform 0.2s;
        }
        .floating-cta:active {
            transform: translateX(-50%) scale(0.96);
        }
        .floating-cta::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 30px;
            box-shadow: 0 0 0 0 rgba(255, 45, 123, 0.55);
            animation: cta-pulse 2s infinite;
        }
        @keyframes cta-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 45, 123, 0.55); }
            70% { box-shadow: 0 0 0 14px rgba(255, 45, 123, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 45, 123, 0); }
        }

        /* 桌面端适配 */
        @media (min-width: 768px) {
            .mobile-container {
                max-width: 1000px;

                padding-right: 40px;

                height: 300px;
            }

                margin-left: 40px;
                margin-right: 40px;
            }
        }
    </style>

</head>

    <script>
        (function () {
            if (document.documentElement.classList.contains('safari-blocked')) return;

            const GIRLS = [
                { img: "17-1.jpg" },
                { img: "15-1.jpg" },
                { img: "2.jpg" },
                { img: "6-21.jpg" },
                { img: "14-1.jpg" },
                { img: "4-1.jpg" },
                { img: "5.jpg" },
                { img: "8-1.jpg" },
                { img: "4.jpg" },
                { img: "b1.jpg" },
                { img: "b2.jpg" },
                { img: "b4.jpg" },
                { img: "b14.jpg" }
            ];
            GIRLS.forEach(function (g) {
                g.downloads = Math.floor(10000 + Math.random() * 70001).toLocaleString('zh-CN');
            });

            function cardHTML(g) {
                return '<div class="room-card">'
                    + '<img class="card-bg" src="img/' + g.img + '" alt="在线用户">'
                    + '<div class="card-overlay"></div>'
                    + '<div class="status-badge">在线</div>'
                    + '<div class="card-info">'
                    + '<h4>🔥 ' + g.downloads + '</h4>'
                    + '<div class="card-meta">'
                    + '<span class="status"><i class="fas fa-circle" style="font-size: 6px;"></i> 在线 · 等待中</span>'
                    + '</div>'
                    + '<button class="card-btn" onclick="k2()"><i class="fas fa-comments"></i> 马上联系</button>'
                    + '</div>'
                    + '</div>';
            }

            var lastColCount = 0;
            function renderWall() {
                var colCount = window.innerWidth >= 768 ? 4 : 2;
                if (colCount === lastColCount) return;
                lastColCount = colCount;

                var cols = [];
                for (var c = 0; c < colCount; c++) cols.push([]);
                GIRLS.forEach(function (g, i) { cols[i % colCount].push(g); });

                var maxCards = 0;
                cols.forEach(function (list) { if (list.length > maxCards) maxCards = list.length; });

                var wall = document.getElementById('rooms-wall');
                wall.innerHTML = cols.map(function (list) {
                    var duration = (40 * list.length / maxCards).toFixed(2);
                    var content = list.map(cardHTML).join('');
                    return '<div class="rooms-wall__col rooms-wall__col--up" style="animation-duration:' + duration + 's">'
                        + content + content
                        + '</div>';
                }).join('');
            }

            renderWall();
            window.addEventListener('resize', renderWall);
        })();
    </script>
